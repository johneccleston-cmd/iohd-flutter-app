<!DOCTYPE html>
<html>
<head>

  <style>
  body, html, flt-glass-pane {
    -webkit-font-smoothing: antialiased !important;
    
    -moz-osx-font-smoothing: grayscale !important;
    text-rendering: optimizeLegibility !important;
  }

  /* The app picks the mouse cursor and Flutter sets it on <body>. The browser's own elements laid over the app (the
     accessibility layer over buttons and text, and the hidden input behind a focused text box) would otherwise show
     the browser's default I-beam over their text instead of the app's pointer. */
  flt-semantics-host, flt-semantics-host *, flt-semantics, flt-semantics *,
  flt-text-editing-host, flt-text-editing-host *, .flt-text-editing, form input, form textarea {
    cursor: inherit !important;
  }
</style>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IOHD Office, the back-office app for Integrity Overhead Door">

  <!-- iOS & Desktop PWA Capable -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IOHD Office">
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>IOHD Office</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
